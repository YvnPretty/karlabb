<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería - Kar Illusion Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="flyer.css">
</head>
<body class="flyer-body">
    <!-- Canvas de Fondo (Toda la página) -->
    <canvas id="bg-canvas"></canvas>

    <div class="flyer-card" style="max-width: 500px;">
        <!-- Logo -->
        <div class="flyer-logo">
            Kar Illusion<br><span>Studio</span>
        </div>
        
        <p class="flyer-info large" style="text-transform: uppercase; margin-top: 1rem; margin-bottom: 1.5rem;">
            ESTUDIO DE ILUSIÓN | KAR
        </p>

        <p class="galeria-text">
            Cuidamos tu estilo con detalles que enamoran. Agenda tu cita.
        </p>

        <!-- Iconos estilo historias -->
        <div class="galeria-header">
            <!-- Icono Pincel -->
            <svg viewBox="0 0 24 24"><path d="M7 14c-1.66 0-3 1.34-3 3 0 1.31-1.16 2-2 2 .92 1.22 2.49 2 4 2 2.21 0 4-1.79 4-4 0-1.66-1.34-3-3-3zm13.71-9.37l-1.34-1.34c-.39-.39-1.02-.39-1.41 0L9 12.25 11.75 15l8.96-8.96c.39-.39.39-1.02 0-1.41z"/></svg>
            <!-- Icono Uñas/Manicura (Estrella) -->
            <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
            <!-- Icono Pestañas/Ojo -->
            <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
            <!-- Icono SPA -->
            <svg viewBox="0 0 24 24"><path d="M22 7V5h-3V2h-2v3h-4V2h-2v3H7V2H5v3H2v2h2v4H2v2h2v4H2v2h3v3h2v-3h4v3h2v-3h4v3h2v-3h3v-2h-3v-4h3v-2h-3V7h3zM18 17H6V7h12v10z"/></svg>
        </div>

        <!-- Grid 3x3 -->
        <div class="galeria-grid">
            <!-- Usando la foto bebé como demostración para los 9 cuadros -->
            <img src="../assets/galeria-1.jpg" alt="Trabajo 1">
            <img src="../assets/galeria-2.jpg" alt="Trabajo 2">
            <img src="../assets/galeria-3.jpg" alt="Trabajo 3">
            <img src="../assets/galeria-4.jpg" alt="Trabajo 4">
            <img src="../assets/galeria-5.jpg" alt="Trabajo 5">
            <img src="../assets/galeria-6.jpg" alt="Trabajo 6">
            <img src="../assets/galeria-7.jpg" alt="Trabajo 7">
            <img src="../assets/galeria-8.jpg" alt="Trabajo 8">
            <img src="../assets/galeria-9.jpg" alt="Trabajo 9">
        </div>
        
        <p style="color: var(--color-text-secondary); font-size: 0.9rem;">(Puedes reemplazar estas fotos por tus trabajos reales en la carpeta assets)</p>
    </div>

    <script src="../script.js"></script>
</body>
</html>
